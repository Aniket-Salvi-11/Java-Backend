spring:
  application:
    name: closemore-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/closemore}
    username: ${DB_USER:closemore}
    password: ${DB_PASSWORD:closemore}

  jpa:
    hibernate:
      
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    com.closemore.backend: DEBUG
