spring:
  application:
    name: closemore-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/closemore}
    username: ${DB_USER:closemore}
    password: ${DB_PASSWORD:closemore}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        globally_quoted_identifiers: true
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

  data:
    web:
      pageable:
        # Applies to every paginated endpoint. @PageableDefault on a controller method overrides
        # default-page-size for that method; max-page-size cannot be overridden that way, which is
        # the point of setting it here.
        default-page-size: 25
        # A hard ceiling on ?size=. Requests above it are clamped, not rejected.
        #
        # Not a general politeness limit - specifically about Avatar_Data_URL and
        # Org_Avatar_Data_URL, which store images inline as base64. A contact row carrying two of
        # them is measured in megabytes, so an uncapped ?size=100000 is a single request asking the
        # server to build a response of a size nothing in the stack is prepared for. Object storage
        # plus a URL is the real fix and is a phase of its own; this stops it getting worse.
        #
        # Note this cap applies only to the OPT-IN paginated path. A caller sending no ?page= or
        # ?size= still receives every visible row, matching the Next.js backend.
        max-page-size: 100
        # Explicit because the two conventions are indistinguishable from a response body, and
        # getting it wrong silently skips or repeats a page. page=0 is the first page.
        one-indexed-parameters: false

  servlet:
    multipart:
      # Explicit rather than defaulted. These two are the only ceiling on how much memory one
      # request can make the application allocate: the attachment controller reads each part fully
      # into a byte[] before handing it to the service, because the stream is tied to the request
      # and the service holds it across a transaction boundary and a storage write.
      max-file-size: 25MB
      max-request-size: 100MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    # QA and production already carry the schema, created by the legacy project's own
    # 001-008 .sql files, and have no flyway_schema_history table. Without a baseline Flyway
    # would treat them as empty and re-run V1 onward against live data. V1-V9 are equivalent
    # to 001-008, so those environments are already at 9 - set these THERE, not here, and
    # verify flyway_schema_history afterwards. See docs/PHASE2_CUTOVER.md step 4.
    #
    #   baseline-on-migrate: true
    #   baseline-version: 9

jwt:
  # Chosen deliberately: see docs/PHASE2_CUTOVER.md. 30 minutes is short enough that revoking a
  # session takes effect almost immediately (deleting the refresh token stops new access tokens,
  # but cannot cancel one already issued), and long enough to be irrelevant to the user - the
  # client refreshes in the background, so a long deal is never interrupted.
  access-token-ttl: 30m
  # A week between password prompts. This is the token that server-side logout actually revokes.
  refresh-token-ttl: 7d
  issuer: closemore-backend
  # HMAC signing key. MUST be at least 32 bytes: NimbusJwtEncoder rejects anything shorter for
  # HS256, so a short secret fails fast at startup rather than silently weakening the signature.
  #
  # The default below exists so tests and local runs work with no setup. It is NOT a secret and
  # every environment must override JWT_SECRET - anyone holding this value can mint a token for
  # any user in any tenant, which bypasses the entire RLS design.
  secret: ${JWT_SECRET:dev-only-insecure-signing-key-change-me-32b}

server:
  port: 8080

logging:
  level:
    com.closemore.backend: DEBUG
closemore:
  storage:
    # local | s3 | oci. Only 'local' has an implementation today: S3 and OCI Object Storage belong
    # with the deployment work, and adding either now means a vendor SDK in pom.xml for code nothing
    # can exercise - which also invalidates the Maven cache and provokes the Maven Central 429s that
    # docs/HANDOFF.md gotcha 11 records.
    provider: local
    local:
      # Relative to the working directory. Production and QA must set an absolute path on a volume
      # that survives a redeploy - a container's writable layer does not, and the database rows would
      # outlive the files they point at.
      root: ./uploads

  ingestion:
    # logging | sqs | oci. 'logging' writes the event and stops there, which is correct for local
    # development and CI. The queue implementations are configuration, not code changes - that is
    # the entire point of IngestionEventPublisher being an interface from the first caller onward.
    #
    # Both are named here rather than only the one that exists, so the property reads as a choice
    # with a default rather than a placeholder someone has to guess the shape of.
    publisher: logging