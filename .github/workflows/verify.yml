name: verify

# Runs the full build including the Testcontainers integration tests
# (TenantIsolationIT + RepositoryTenantIsolationIT) on Linux, where Docker is
# native and Testcontainers works without the Docker-Desktop-on-Windows
# named-pipe / API-version problems. This is the authoritative gate for the
# tenant-isolation proof - a green run here is the evidence that RLS holds,
# including through Hibernate.

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # ubuntu-latest ships with Docker already running, so Testcontainers
      # finds it via the default unix socket - no DOCKER_HOST, no api.version
      # pinning, none of the Windows workarounds are needed here.
      - name: Build and run all tests (unit + integration)
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Upload failsafe reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: target/failsafe-reports/
