name: verify

# Runs the full build including the Testcontainers integration tests on Linux, where Docker is
# native and Testcontainers works without the Docker-Desktop-on-Windows named-pipe / API-version
# problems. This is the authoritative gate for the tenant-isolation proof - a green run here is the
# evidence that RLS holds, including through Hibernate.

on:
  push:
    branches: [ "**" ]
    # paths-ignore must be nested INSIDE push (same indent as branches), not alongside it under
    # `on:`. Getting that wrong produces "Invalid workflow file ... A sequence was not expected"
    # and GitHub refuses to run the workflow at all - which looks like a build failure but means
    # no build happened, so the previous commit's status tells you nothing about the new code.
    #
    # Note this only skips a run when EVERY changed file matches. A commit touching both a .md and
    # a .java file still runs, which is the behaviour you want.
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ "**" ]
    paths-ignore:
      - '**.md'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Pulling the image up front separates "Docker Hub was slow or rate-limited" from "the test
      # failed", which are otherwise indistinguishable in a Testcontainers startup timeout.
      - name: Pre-pull the Postgres image
        run: docker pull postgres:16-alpine

      # ubuntu-latest ships with Docker already running, so Testcontainers finds it via the default
      # unix socket - no DOCKER_HOST, no api.version pinning, none of the Windows workarounds.
      - name: Build and run all tests (unit + integration)
        run: mvn --batch-mode --no-transfer-progress verify

      # Printed inline so a failed run can be diagnosed straight from the job log rather than by
      # downloading the artifact - it matters when CI is the only place the suite can run.
      - name: Print test reports on failure
        if: failure()
        run: |
          echo "=================== FAILSAFE ==================="
          for f in target/failsafe-reports/*.txt; do
            [ -e "$f" ] || continue
            echo "----- $f -----"; cat "$f"
          done
          echo "=================== SUREFIRE ==================="
          for f in target/surefire-reports/*.txt; do
            [ -e "$f" ] || continue
            echo "----- $f -----"; cat "$f"
          done

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/failsafe-reports/
            target/surefire-reports/
          if-no-files-found: ignore